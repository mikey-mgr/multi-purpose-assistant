services:
  db:
    image: pgvector/pgvector:pg16
    container_name: multipurpose_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # init.sql creates the application database from the default postgres DB.
      POSTGRES_DB: postgres
    ports:
      # 5432 and 5433 are already used by other local Docker projects.
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_configs/migrations:/opt/app/migrations:ro
      - ./db_configs/docker-init/01-initialize-database.sh:/docker-entrypoint-initdb.d/01-initialize-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      DB_CONN_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/ai_assistant
      OUTPUT_DIR: /app/data
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITERT_API_KEY: ${LITERT_API_KEY:-}
      LITERT_API_URL: ${LITERT_API_URL:-http://192.168.100.11:8055/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-models/gemini-3.5-flash-lite}
      CV_HEADLINE: ${CV_HEADLINE:-Software Developer  ·  DevOps Enthusiast}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - application_data:/app/data
      - ./profiles:/app/profiles:ro
      - ./documents:/app/documents:ro
    # This is a safe utility container. Pipeline stages run only when invoked.
    command: ["sleep", "infinity"]

  prefect-server:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prefect-runtime
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      # SQLite is not reliable with concurrent Prefect API and service writes.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/prefect
      PREFECT_HOME: /app/prefect-data
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      # Prefect runs as appuser, so UI assets must be prepared in a writable path.
      PREFECT_SERVER_UI_STATIC_DIRECTORY: /app/prefect-data/ui
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_data:/app/prefect-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  prefect-runner:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prefect-runtime
    restart: unless-stopped
    environment:
      DB_CONN_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/ai_assistant
      OUTPUT_DIR: /app/data
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_USER_ID: ${PREFECT_USER_ID:-}
      PREFECT_ENABLE_SCHEDULES: ${PREFECT_ENABLE_SCHEDULES:-false}
      PREFECT_ENABLE_OUTBOUND: ${PREFECT_ENABLE_OUTBOUND:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITERT_API_KEY: ${LITERT_API_KEY:-}
      LITERT_API_URL: ${LITERT_API_URL:-http://192.168.100.11:8055/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-models/gemini-3.5-flash-lite}
      CV_HEADLINE: ${CV_HEADLINE:-Software Developer  ·  DevOps Enthusiast}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://host.docker.internal:8080}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-Apex_Web_Services}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:8055/api/webhooks/evolution}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-263712210204@s.whatsapp.net}
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    volumes:
      - application_data:/app/data
      - ./app:/app/app:ro
      - ./core:/app/core:ro
      - ./prefect_flows:/app/prefect_flows:ro
      - ./scrapers:/app/scrapers:ro
      - ./profiles:/app/profiles:ro
      - ./documents:/app/documents:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webhook-server:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prefect-runtime
    restart: unless-stopped
    command: ["python", "-m", "app.webhook_server"]
    environment:
      DB_CONN_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/ai_assistant
      OUTPUT_DIR: /app/data
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_USER_ID: ${PREFECT_USER_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITERT_API_KEY: ${LITERT_API_KEY:-}
      LITERT_API_URL: ${LITERT_API_URL:-http://192.168.100.11:8055/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-models/gemini-3.5-flash-lite}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://host.docker.internal:8080}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-Apex_Web_Services}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:8055/api/webhooks/evolution}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-263712210204@s.whatsapp.net}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_ALLOWED_NUMBERS: ${WHATSAPP_ALLOWED_NUMBERS:-}
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8055
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    ports:
      - "${WEBHOOK_PORT:-8055}:8055"
    volumes:
      - application_data:/app/data
      - ./app:/app/app:ro
      - ./core:/app/core:ro
      - ./prefect_flows:/app/prefect_flows:ro
      - ./scrapers:/app/scrapers:ro
      - ./profiles:/app/profiles:ro
      - ./documents:/app/documents:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
    name: multipurpose-assistant-postgres-data
  application_data:
    name: multipurpose-assistant-application-data
  prefect_data:
    name: multipurpose-assistant-prefect-data
